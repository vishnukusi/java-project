# SentinelCV Configuration
spring.application.name=SentinelCV

# Server
server.port=8080

# SQLite Database
spring.datasource.url=jdbc:sqlite:${sentinelcv.data.dir:./data}/sentinelcv.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# SentinelCV Custom Properties
sentinelcv.data.dir=./data
sentinelcv.upload.dir=./data/uploads
sentinelcv.reports.dir=./data/reports
sentinelcv.temp.dir=./data/temp
sentinelcv.models.dir=./data/models
sentinelcv.datasets.dir=./data/datasets

# Audit Settings
sentinelcv.audit.max-image-size-mb=50
sentinelcv.audit.max-model-size-mb=2048
sentinelcv.audit.thread-pool-size=4
sentinelcv.audit.perceptual-hash-threshold=10
sentinelcv.audit.duplicate-similarity-threshold=0.95

# Risk Assessment Thresholds
sentinelcv.risk.critical-threshold=1
sentinelcv.risk.high-threshold=3
sentinelcv.risk.medium-threshold=5
sentinelcv.risk.quarantine-score=80
sentinelcv.risk.review-score=40

# Logging
logging.level.com.sentinelcv=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
